version: "3.8"

services:
  nginx:
    build:
      context: ./nginx
    container_name: nginx
    ports:
      - "80:80"
    restart: always
    depends_on:
      - django
    networks:
          - notes-app
      
  django:
    build:
      context: .
    container_name: django_cont
    depends_on:
      - mysql

    command: sh -c "python manage.py migrate --no-input && gunicorn notesapp.wsgi --bind 0.0.0.0:8000"
    env_file:
      - ".env"
    restart: always
    networks:
      - notes-app
    ports:
      - "8000:8000"

  mysql:
    image: mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: just_db

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - notes-app


volumes:
  mysql-data:

networks:
   notes-app:

  
